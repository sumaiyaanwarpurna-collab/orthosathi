<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230f766e'/%3E%3Crect x='146' y='388' width='220' height='40' rx='20' fill='%23fff'/%3E%3Crect x='146' y='340' width='220' height='40' rx='20' fill='%23fff' fill-opacity='.8'/%3E%3Crect x='146' y='292' width='220' height='40' rx='20' fill='%23fff' fill-opacity='.65'/%3E%3Cpath d='M256 284V196' stroke='%23fff' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M256 236C200 241 170 206 168 166c47 0 84 25 88 70z' fill='%23fff'/%3E%3Cpath d='M256 206c44 5 79-25 84-70-45-2-82 25-84 70z' fill='%23fff'/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অর্থসাথী</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2a24;--mu:#66756e;--pr:#0f766e;--ok:#15803d;--wa:#b45309;--er:#b91c1c;--bd:#e2e6e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101614;--card:#18211e;--tx:#e8efec;--mu:#97a8a0;--pr:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--bd:#2a3733;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101614;--card:#18211e;--tx:#e8efec;--mu:#97a8a0;--pr:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--bd:#2a3733;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:760px;margin:auto}
h1{font-size:22px;margin:0;color:var(--pr)}h2{font-size:17px;margin:18px 0 8px}
main{max-width:760px;margin:auto;padding:0 16px 96px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mu);font-size:13px}.v{font-size:20px;font-weight:600}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 8px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:13px 16px;width:100%;font-weight:600;cursor:pointer}
.btn.s{width:auto;padding:6px 12px;background:var(--bd);color:var(--tx);font-weight:500;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mu);display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{overflow-x:auto}nav button{flex:1 0 auto;white-space:nowrap;background:none;border:0;padding:12px 12px;color:var(--mu);font-size:14px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:600;border-top:3px solid var(--pr)}
.note{font-size:13px;color:var(--mu)}.msg{color:var(--er);font-size:14px;min-height:20px}
.tag{font-size:11px;background:var(--bd);border-radius:6px;padding:1px 6px;margin-left:4px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header><h1 style="display:flex;align-items:center;gap:8px"><svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><rect x="146" y="388" width="220" height="40" rx="20" fill="#fff" fill-opacity=".95"/><rect x="146" y="340" width="220" height="40" rx="20" fill="#fff" fill-opacity=".8"/><rect x="146" y="292" width="220" height="40" rx="20" fill="#fff" fill-opacity=".65"/><path d="M256 284V196" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M256 236C200 241 170 206 168 166c47 0 84 25 88 70z" fill="#fff"/><path d="M256 206c44 5 79-25 84-70-45-2-82 25-84 70z" fill="#fff"/></svg>অর্থসাথী</h1><span><button class="btn s" onclick="togLang()" id="lb"></button> <button class="btn s" onclick="togNum()" id="nb"></button></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='arthoshathi_v1';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{income:[],expense:[],budget:[50,20,20,10],bn:true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab='dash',edit=null,q='',pend=null;['goals','dps','sp','loans','cards'].forEach(k=>S[k]=S[k]||[]);
const IC=['বেতন','ব্যবসা','ফ্রিল্যান্সিং','ভাড়া আয়','বিনিয়োগ আয়','অন্যান্য আয়'];
const EC=[['খাদ্য ও বাজার',0],['বাড়ি ভাড়া',0],['বিদ্যুৎ',0],['গ্যাস',0],['পানি',0],['ইন্টারনেট ও মোবাইল',0],['যাতায়াত',0],['চিকিৎসা',0],['শিক্ষা',0],['পারিবারিক খরচ',0],['কেনাকাটা',2],['বিনোদন',2],['ভ্রমণ',2],['ব্যক্তিগত যত্ন',2],['দান ও সদকা',2],['অন্যান্য খরচ',2]];
const PM=['ক্যাশ','বিকাশ','নগদ','ব্যাংক','কার্ড'];
const BN=['আবশ্যিক খরচ','সঞ্চয় ও বিনিয়োগ','ব্যক্তিগত ও জীবনযাত্রা','জরুরি তহবিল ও লক্ষ্য'];
const TABS=[['dash','ড্যাশবোর্ড'],['income','আয়'],['expense','ব্যয়'],['budget','বাজেট'],['goals','সঞ্চয়'],['dps','DPS'],['sp','সঞ্চয়পত্র'],['zakat','যাকাত'],['loan','ঋণ'],['rep','রিপোর্ট'],['cc','ক্রেডিট কার্ড'],['set','সেটিংস']];
const D='০১২৩৪৫৬৭৮৯';
const n=s=>S.bn?String(s).replace(/\d/g,d=>D[d]):String(s);
const money=x=>'৳ '+n(Math.round(x).toLocaleString('en-US'));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>{const[y,m,x]=d.split('-');return n(x+'/'+m+'/'+y)};
const sum=a=>a.reduce((s,r)=>s+r.amt,0);
const cur=t=>S[t].filter(r=>r.date.slice(0,7)===today().slice(0,7));
const grp=c=>(EC.find(e=>e[0]===c)||[0,2])[1];
const $=s=>document.querySelector(s);

function budgetRows(){
  const inc=sum(cur('income')),ex=cur('expense');
  const sp=[sum(ex.filter(r=>grp(r.cat)===0)),0,sum(ex.filter(r=>grp(r.cat)===2)),0];
  return BN.map((name,i)=>{const lim=inc*S.budget[i]/100;return{name,i,lim,spent:sp[i],track:i===0||i===2}});
}
function bars(rows){
  return rows.map(r=>{
    if(!r.track)return `<div class="row"><div>${r.name}<small>প্রস্তাবিত বরাদ্দ (সঞ্চয় মডিউল পরবর্তী ধাপে)</small></div><b>${money(r.lim)}</b></div>`;
    const p=r.lim>0?r.spent/r.lim*100:(r.spent>0?101:0);
    const c=p>100?'er':p>=80?'wa':'ok';
    return `<div style="padding:8px 0"><div style="display:flex;justify-content:space-between"><span>${r.name}</span><span class="${c}">${money(r.spent)} / ${money(r.lim)}</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:var(--${c==='ok'?'pr':c})"></i></div><div class="note">${r.lim>0?(p>100?'সীমা ছাড়িয়েছে: '+money(r.spent-r.lim):'বাকি আছে: '+money(r.lim-r.spent)):'বাজেট হিসাবের জন্য আগে আয় যোগ করুন'}</div></div>`;
  }).join('');
}
function dash(){
  const inc=sum(cur('income')),exp=sum(cur('expense')),all=cash();
  const cats={};cur('expense').forEach(r=>cats[r.cat]=(cats[r.cat]||0)+r.amt);
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const rec=[...S.income.map(r=>({...r,t:'i'})),...S.expense.map(r=>({...r,t:'e'}))].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);
  const mx=Math.max(inc,exp,1);
  return `<div class="grid"><div class="card"><div class="k">এ মাসের আয়</div><div class="v ok">${money(inc)}</div></div>
  <div class="card"><div class="k">এ মাসের ব্যয়</div><div class="v er">${money(exp)}</div></div>
  <div class="card"><div class="k">এ মাসের সঞ্চয় (আয় − ব্যয়)</div><div class="v ${inc-exp<0?'er':''}">${money(inc-exp)}</div></div>
  <div class="card"><div class="k">মোট ব্যালেন্স</div><div class="v ${all<0?'er':''}">${money(all)}</div></div></div>
  ${remBox()}${extra()}${cardSum()}<h2>আয় বনাম ব্যয়</h2><div class="card"><div class="k">আয়</div><div class="bar"><i style="width:${inc/mx*100}%"></i></div><div class="k">ব্যয়</div><div class="bar"><i style="width:${exp/mx*100}%;background:var(--er)"></i></div></div>
  <h2>বাজেট ব্যবহার</h2><div class="card">${bars(budgetRows())}</div>
  <h2>ব্যয়ের খাত</h2><div class="card">${cl.length?cl.map(([c,a])=>`<div style="padding:5px 0"><div style="display:flex;justify-content:space-between"><span>${c}</span><span>${money(a)} (${n(Math.round(a/exp*100))}%)</span></div><div class="bar"><i style="width:${a/exp*100}%"></i></div></div>`).join(''):'<div class="note">এ মাসে এখনও কোনো ব্যয় নেই।</div>'}</div>
  <h2>সাম্প্রতিক লেনদেন</h2><div class="card">${rec.length?rec.map(r=>`<div class="row"><div>${esc(r.cat)}<small>${fd(r.date)} · ${esc(r.desc||r.method)}</small></div><b class="${r.t==='i'?'ok':'er'}">${r.t==='i'?'+':'−'}${money(r.amt)}</b></div>`).join(''):'<div class="note">কোনো লেনদেন নেই। আয় বা ব্যয় যোগ করে শুরু করুন।</div>'}</div>`;
}
function txn(t){
  const isI=t==='income',cats=isI?IC:EC.map(e=>e[0]);
  const e=edit&&edit.t===t?S[t].find(r=>r.id===edit.id):null;
  const L=S[t].filter(r=>!q||(r.cat+' '+(r.desc||'')+' '+(r.note||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  return `<div class="card"><b>${e?'সম্পাদনা':isI?'নতুন আয়':'নতুন ব্যয়'}</b>
  <input id="f_amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="পরিমাণ (৳)" value="${e?e.amt:''}">
  <input id="f_date" type="date" value="${e?e.date:today()}">
  <select id="f_cat">${cats.map(c=>`<option${e&&e.cat===c?' selected':''}>${c}</option>`).join('')}</select>
  <select id="f_pm">${PM.map(c=>`<option${e&&e.method===c?' selected':''}>${c}</option>`).join('')}</select>
  <input id="f_desc" placeholder="বিবরণ" value="${e?esc(e.desc||''):''}">
  ${isI?'':`<input id="f_note" placeholder="নোট (ঐচ্ছিক)" value="${e?esc(e.note||''):''}">`}
  <label><input id="f_rec" type="checkbox" style="width:auto"${e&&e.rec?' checked':''}> পৌনঃপুনিক (প্রতি মাসে)</label>
  <div class="msg" id="msg"></div>
  <button class="btn" onclick="saveTxn('${t}')">${e?'হালনাগাদ করুন':'সংরক্ষণ করুন'}</button>
  ${e?`<button class="btn s" style="margin-top:8px" onclick="edit=null;render()">বাতিল</button>`:''}</div>
  <input id="f_q" placeholder="খুঁজুন..." value="${esc(q)}" oninput="q=this.value;list(${isI})">
  <div class="card" id="lst"></div>`;
}
function list(isI){
  const t=isI?'income':'expense';
  const L=S[t].filter(r=>!q||(r.cat+' '+(r.desc||'')+' '+(r.note||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('#lst').innerHTML=L.length?L.map(r=>`<div class="row"><div>${esc(r.cat)}${r.rec?'<span class="tag">পৌনঃপুনিক</span>':''}<small>${fd(r.date)} · ${esc(r.method)}${r.desc?' · '+esc(r.desc):''}</small></div><div style="text-align:right"><b class="${isI?'ok':'er'}">${money(r.amt)}</b><br><button class="btn s" onclick="edit={t:'${t}',id:${r.id}};render();scrollTo(0,0)">এডিট</button> <button class="btn s" onclick="del('${t}',${r.id})">মুছুন</button></div></div>`).join(''):'<div class="note">কোনো রেকর্ড পাওয়া যায়নি।</div>';
}
function saveTxn(t){
  const amt=parseFloat($('#f_amt').value),date=$('#f_date').value;
  if(!isFinite(amt)||amt<=0)return $('#msg').textContent='সঠিক পরিমাণ লিখুন।';
  if(!date)return $('#msg').textContent='তারিখ নির্বাচন করুন।';
  const r={id:edit&&edit.t===t?edit.id:Date.now(),amt:Math.round(amt*100)/100,date,cat:$('#f_cat').value,method:$('#f_pm').value,desc:$('#f_desc').value.trim(),rec:$('#f_rec').checked};
  if(t==='expense')r.note=$('#f_note').value.trim();
  const i=S[t].findIndex(x=>x.id===r.id);
  if(i>=0){if(S[t][i].cc)r.cc=S[t][i].cc;S[t][i]=r}else S[t].push(r);
  edit=null;save();render();
}
function sure(b,k){if(pend===k)return true;pend=k;b.textContent='নিশ্চিত? আবার চাপুন';return false}
function del(t,id){if(!sure(event.target,t+id))return;pend=null;S[t]=S[t].filter(r=>r.id!==id);save();render()}
function budget(){
  const tot=S.budget.reduce((a,b)=>a+b,0),inc=sum(cur('income')),r=budgetRows();
  const over=r.filter(x=>x.track&&x.spent>x.lim&&inc>0);
  let tip='';
  if(inc===0)tip='বাজেট হিসাব করতে এ মাসের আয় যোগ করুন।';
  else if(over.length)tip=over.map(x=>`“${x.name}” সীমার চেয়ে ${money(x.spent-x.lim)} বেশি। অন্য খাত থেকে সমন্বয় করুন বা শতকরা হার বদলান।`).join(' ');
  else tip='এ পর্যন্ত সব খাত প্রস্তাবিত সীমার মধ্যে আছে।';
  return `<div class="card"><b>বাজেট শতকরা হার</b><div class="note">এগুলো শুধু প্রাথমিক প্রস্তাব, আপনার প্রকৃত হিসাব নয়। নিজের মতো বদলান।</div>
  ${BN.map((b,i)=>`<label class="k">${b} (%)</label><input type="number" min="0" max="100" value="${S.budget[i]}" onchange="setB(${i},this.value)">`).join('')}
  <div class="${tot===100?'ok':'er'}">মোট: ${n(tot)}% ${tot===100?'':'— মোট ১০০% হওয়া উচিত'}</div></div>
  <div class="card"><b>এ মাসের আয়: ${money(inc)}</b><div style="margin-top:8px">${bars(r)}</div></div>
  <div class="card"><b>পরামর্শ</b><div class="note" style="margin-top:6px">${tip}</div></div>`;
}
function setB(i,v){const x=parseFloat(v);S.budget[i]=isFinite(x)&&x>=0?Math.min(x,100):0;save();render()}
const sf=(a,f)=>a.reduce((s,x)=>s+f(x),0),nv=id=>{const v=$('#'+id).value;return v===''?null:parseFloat(v)};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function addM(ds,k,day){const[y,m,x]=ds.split('-').map(Number);const l=new Date(y,m+k,0).getDate();return iso(new Date(y,m-1+k,Math.min(day||x,l)))}
const days=ds=>Math.round((new Date(ds+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const saved=g=>sf(g.tx,t=>t.amt),dpsOn=d=>d.status==='চলমান'||d.status==='বিরতি',dpsDep=d=>sf(d.paid,p=>p.amt);
const nextDue=d=>addM(d.open,d.paid.length+d.missed.length,d.due);
const lab=(t,h)=>`<label class="k">${t}</label>${h}`;
const inp=(id,ph,t,x)=>`<input id="${id}" type="${t||'text'}" placeholder="${ph}" ${x||''}>`;
const nin=(id,ph)=>inp(id,ph,'number','inputmode="decimal" step="any" min="0"');
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
function cash(){return (S.open||0)+loanCash()+sum(S.income)-sum(S.expense.filter(r=>!r.cc))-sf(S.cards,c=>sf(c.pays,p=>p.amt))-sf(S.goals,saved)-sf(S.dps,dpsDep)-sum(S.sp)+sf(S.dps.filter(d=>!dpsOn(d)),d=>d.actual||dpsDep(d))+sf(S.sp.filter(s=>s.status==='পরিপক্ক'),s=>s.actual||s.amt)}
function extra(){
  const a=sf(S.goals,saved),dp=sf(S.dps.filter(dpsOn),dpsDep),sp=sf(S.sp.filter(s=>s.status==='সক্রিয়'),s=>s.amt),up=[];
  S.dps.filter(d=>d.status==='চলমান'&&d.paid.length<d.months).forEach(d=>up.push([nextDue(d),esc(d.bank)+' DPS কিস্তি',d.inst]));
  S.dps.filter(dpsOn).forEach(d=>{const m=addM(d.open,d.months);if(days(m)<=60)up.push([m,esc(d.bank)+' DPS মেয়াদপূর্তি',null])});
  S.sp.filter(s=>s.status==='সক্রিয়'&&days(s.mat)<=60).forEach(s=>up.push([s.mat,esc(s.type)+' পরিপক্কতা',null]));

function remList(){const L=[],t=today(),ym=t.slice(0,7);

  S.dps.filter(d=>d.status==='চলমান'&&d.paid.length<d.months).forEach(d=>{const nd=nextDue(d),dd=days(nd);if(dd<0&&rmOn('miss'))L.push(['e',esc(d.bank)+' DPS কিস্তি '+n(-dd)+' দিন বকেয়া।']);else if(dd>=0&&dd<=3&&rmOn('dps'))L.push(['w',esc(d.bank)+' DPS কিস্তির তারিখ '+fd(nd)+'।'])});
  if(rmOn('mat')){S.dps.filter(dpsOn).forEach(d=>{const m=addM(d.open,d.months),x=days(m);if(x>=0&&x<=30)L.push(['w','DPS মেয়াদপূর্তি '+fd(m)+' — '+esc(d.bank)])});S.sp.filter(s=>s.status==='সক্রিয়'&&days(s.mat)>=0&&days(s.mat)<=30).forEach(s=>L.push(['w',esc(s.type)+' পরিপক্ক হবে '+fd(s.mat)+'।']))}
  if(rmOn('bill')){const m={};S.expense.filter(r=>r.rec).forEach(r=>{const k=r.cat+'|'+(r.desc||'');if(!m[k]||r.date>m[k].date)m[k]=r});Object.values(m).forEach(r=>{if(r.date.slice(0,7)<ym&&+t.slice(8)>=+r.date.slice(8)&&!S.expense.some(x=>x.cat===r.cat&&(x.desc||'')===(r.desc||'')&&x.date.slice(0,7)===ym))L.push(['w','পৌনঃপুনিক খরচ এ মাসে লেখা হয়নি: '+esc(r.cat)+(r.desc?' · '+esc(r.desc):'')])})}
  if(rmOn('goal'))S.goals.filter(g=>g.target-saved(g)>0&&days(g.date)>=0&&days(g.date)<=30).forEach(g=>L.push(['w',esc(g.name)+' লক্ষ্যের তারিখ ঘনিয়ে এসেছে, বাকি '+money(g.target-saved(g))]));
  if(rmOn('loan'))S.loans.filter(l=>loanRem(l)>0&&l.due&&days(l.due)<=7).forEach(l=>L.push([days(l.due)<0?'e':'w',esc(l.party)+(l.kind==='নেওয়া'?' ঋণ পরিশোধের তারিখ ':' পাওনা আদায়ের তারিখ ')+fd(l.due)+(days(l.due)<0?' (পার হয়েছে)':'')]));
  if(rmOn('zakat')&&S.income.length&&(!S.zrev||days(S.zrev)<-355))L.push(['i','যাকাত পর্যালোচনার সময় হয়েছে।']);

  return L}

  ${nin('cka'+c.id,'খরচের পরিমাণ (৳)')}<select id="ckc${c.id}">${opts(EC.map(e=>e[0]))}</select>${inp('ckd'+c.id,'বিবরণ')}${lab('তারিখ',inp('ckt'+c.id,'','date','value="'+today()+'"'))}<button class="btn s" onclick="cardCharge(${c.id})">খরচ যোগ করুন</button>
  ${nin('ckp'+c.id,'বিল পরিশোধ (৳)')}<div class="msg" id="kmm${c.id}"></div><button class="btn s" onclick="cardPay(${c.id})">পরিশোধ রেকর্ড</button> <button class="btn s" onclick="delCard(${c.id})">মুছুন</button><div class="note">কার্ড মুছলে এর সব খরচ ও পরিশোধ মুছে যাবে।</div>
  ${chs.length?`<div class="note" style="margin-top:8px">সাম্প্রতিক খরচ: ${chs.map(r=>fd(r.date)+' '+esc(r.cat)+' '+money(r.amt)).join(', ')}</div>`:''}${c.pays.length?`<div class="note">পরিশোধ: ${c.pays.slice(-4).reverse().map(x=>fd(x.date)+' '+money(x.amt)).join(', ')}</div>`:''}</div>`}
function addCard(){const nm=$('#k_n').value.trim(),l=nv('k_l'),s=nv('k_s'),d=nv('k_d'),m=$('#km');
  if(!nm)return m.textContent='কার্ডের নাম দিন।';if(!(l>0))return m.textContent='সঠিক লিমিট দিন।';if(!Number.isInteger(s)||s<1||s>31)return m.textContent='স্টেটমেন্ট তারিখ ১–৩১ এর মধ্যে দিন।';if(!Number.isInteger(d)||d<1||d>31)return m.textContent='পরিশোধের তারিখ ১–৩১ এর মধ্যে দিন।';
  S.cards.push({id:Date.now(),name:nm,limit:l,sd:s,dd:d,pays:[]});save();render()}
function cardCharge(id){const c=S.cards.find(x=>x.id===id),a=nv('cka'+id),d=$('#ckt'+id).value,m=$('#kmm'+id);
  if(!(a>0))return m.textContent='সঠিক পরিমাণ লিখুন।';if(!d)return m.textContent='তারিখ নির্বাচন করুন।';
  S.expense.push({id:Date.now(),amt:Math.round(a*100)/100,date:d,cat:$('#ckc'+id).value,method:'কার্ড',desc:$('#ckd'+id).value.trim()||c.name,rec:false,note:'',cc:id});save();render()}
function cardPay(id){const c=S.cards.find(x=>x.id===id),a=nv('ckp'+id),m=$('#kmm'+id);
  if(!(a>0))return m.textContent='সঠিক পরিমাণ লিখুন।';if(a>Math.max(cardBal(c),0)+0.005)return m.textContent='বকেয়ার চেয়ে বেশি নয়।';
  c.pays.push({id:Date.now(),date:today(),amt:a});save();render()}
function delCard(id){if(!sure(event.target,'k'+id))return;pend=null;S.cards=S.cards.filter(c=>c.id!==id);S.expense=S.expense.filter(r=>r.cc!==id);save();render()}
function togNum(){S.bn=!S.bn;save();render()}
function render(){if(locked){showLock();return}
  $('#lb').textContent=S.lang==='en'?'বাংলা':'EN';document.documentElement.lang=S.lang==='en'?'en':'bn';$('#nb').textContent=S.bn?'123':'১২৩';
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';edit=null;q='';render();scrollTo(0,0)">${l}</button>`).join('');
  $('#app').innerHTML=tab==='dash'?dash():tab==='budget'?budget():tab==='goals'?goalsV():tab==='dps'?dpsV():tab==='sp'?spV():tab==='zakat'?zakatV():tab==='loan'?loanV():tab==='rep'?repV():tab==='set'?setV():tab==='cc'?ccV():txn(tab);
  if(tab==='income'||tab==='expense')list(tab==='income');
}
render();
</script></body></html>
